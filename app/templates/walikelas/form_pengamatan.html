{% extends 'base.html' %}
{% block title %}Tambah Catatan Pengamatan{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card">
      <div class="card-header bg-white">
        <h5 class="fw-bold mb-0">Tambah Catatan Pengamatan Siswa</h5>
        <small class="text-muted">Data ini berfungsi sebagai pembanding bagi guru Bimbingan Konseling.</small>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="siswa_id" class="form-label fw-semibold small">Pilih Siswa (Binaan Kelas)</label>
            <select class="form-select" id="siswa_id" name="siswa_id" required>
              <option value="">-- Pilih Siswa --</option>
              {% for s in daftar_siswa %}
                <option value="{{ s.id }}">{{ s.kode_siswa }} ({{ s.kelas }})</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="periode" class="form-label fw-semibold small">Periode Pengamatan</label>
            <input type="text" class="form-control" id="periode" name="periode" value="2024-01" required placeholder="YYYY-MM">
          </div>

          <div class="mb-3">
            <label for="skor_perilaku" class="form-label fw-semibold small">Skor Perilaku Umum (Opsional: 1 - 5)</label>
            <select class="form-select" id="skor_perilaku" name="skor_perilaku">
              <option value="">-- Pilih Skor (Opsional) --</option>
              <option value="1">1 - Sangat Perlu Perhatian</option>
              <option value="2">2 - Kurang Kondusif</option>
              <option value="3">3 - Cukup Baik</option>
              <option value="4">4 - Baik</option>
              <option value="5">5 - Sangat Baik & Teladan</option>
            </select>
          </div>

          <div class="mb-4">
            <label for="catatan" class="form-label fw-semibold small">Catatan Pengamatan Perilaku Siswa</label>
            <textarea class="form-control" id="catatan" name="catatan" rows="4" required
                      placeholder="Tuliskan catatan kejadian, interaksi teman, kedisiplinan, atau emosi siswa di kelas..."></textarea>
          </div>

          <div class="d-flex justify-content-between">
            <a href="{{ url_for('walikelas.pengamatan_list') }}" class="btn btn-outline-secondary">Batal</a>
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-save me-1"></i> Simpan Catatan
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
