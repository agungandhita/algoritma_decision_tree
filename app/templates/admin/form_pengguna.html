{% extends 'base.html' %}
{% block title %}{{ 'Edit Pengguna' if edit else 'Tambah Pengguna' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card">
      <div class="card-header bg-white">
        <h5 class="fw-bold mb-0">{{ 'Edit Pengguna' if edit else 'Tambah Pengguna Baru' }}</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="nama_lengkap" class="form-label fw-semibold small">Nama Lengkap</label>
            <input type="text" class="form-control" id="nama_lengkap" name="nama_lengkap"
                   value="{{ user.nama_lengkap if edit else '' }}" required>
          </div>

          <div class="mb-3">
            <label for="username" class="form-label fw-semibold small">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   value="{{ user.username if edit else '' }}" {{ 'readonly' if edit else '' }} required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small">Alamat Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ user.email if edit else '' }}" required>
          </div>

          <div class="mb-3">
            <label for="peran" class="form-label fw-semibold small">Peran Pengguna</label>
            <select class="form-select" id="peran" name="peran" required onchange="toggleKelasDiampu()">
              <option value="admin" {% if edit and user.peran == 'admin' %}selected{% endif %}>Administrator</option>
              <option value="guru_bk" {% if edit and user.peran == 'guru_bk' %}selected{% endif %}>Guru Bimbingan Konseling (BK)</option>
              <option value="wali_kelas" {% if edit and user.peran == 'wali_kelas' %}selected{% endif %}>Wali Kelas</option>
              <option value="kepala_sekolah" {% if edit and user.peran == 'kepala_sekolah' %}selected{% endif %}>Kepala Sekolah</option>
            </select>
          </div>

          <div class="mb-3" id="group_kelas_diampu" style="display: none;">
            <label for="kelas_diampu" class="form-label fw-semibold small">Kelas yang Diampu (Wali Kelas)</label>
            <input type="text" class="form-control" id="kelas_diampu" name="kelas_diampu"
                   placeholder="Contoh: X RPL, X TKJ" value="{{ user.kelas_diampu if edit and user.kelas_diampu else '' }}">
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold small">
              {{ 'Kata Sandi Baru (Kosongkan jika tidak ingin diubah)' if edit else 'Kata Sandi' }}
            </label>
            <input type="password" class="form-control" id="password" name="password" {{ '' if edit else 'required' }}>
          </div>

          <div class="d-flex justify-content-between">
            <a href="{{ url_for('admin.pengguna_list') }}" class="btn btn-outline-secondary">Batal</a>
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-save me-1"></i> {{ 'Simpan Perubahan' if edit else 'Tambah Pengguna' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
function toggleKelasDiampu() {
  const peran = document.getElementById('peran').value;
  const group = document.getElementById('group_kelas_diampu');
  group.style.display = (peran === 'wali_kelas') ? 'block' : 'none';
}
document.addEventListener('DOMContentLoaded', toggleKelasDiampu);
</script>
{% endblock %}
